name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/industrial-backend

            echo "Recording last-known-good image..."
            LAST_GOOD=$(docker inspect backend-live --format '{{.Image}}' 2>/dev/null || echo "none")
            echo "$LAST_GOOD" > .last-good-image
            echo "Last known good: $LAST_GOOD"

            echo "Pulling new image..."
            docker pull ghcr.io/${{ github.repository }}:latest

            echo "Starting new container..."
            docker rm -f backend-candidate 2>/dev/null || true
            docker run -d --name backend-candidate \
              --env-file .env.deploy-test \
              --network host \
              -v /home/ubuntu/certs:/home/ubuntu/certs:ro \
              ghcr.io/${{ github.repository }}:latest

            echo "Waiting for health check..."
            sleep 5
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health)

            if [ "$HEALTH" != "200" ]; then
              echo "Health check failed with status $HEALTH. Rolling back."
              docker rm -f backend-candidate
              exit 1
            fi

            echo "Health check passed on candidate. Stopping test container."
            docker rm -f backend-candidate

            echo "Cutting over to production..."
            sudo systemctl restart industrial-backend

            echo "Waiting for production health check..."
            sleep 8
            PROD_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)

            if [ "$PROD_HEALTH" != "200" ]; then
              echo "PRODUCTION HEALTH CHECK FAILED ($PROD_HEALTH). Reverting to last known good."
              docker tag $(cat .last-good-image) ghcr.io/${{ github.repository }}:latest
              sudo systemctl restart industrial-backend
              sleep 8
              REVERT_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
              echo "Reverted. Health after revert: $REVERT_HEALTH"
              ntfy publish --title "Deploy Failed - Auto-Reverted" --priority high pratik-gateway-alerts "New version failed health check ($PROD_HEALTH). Automatically reverted to last-known-good. Health after revert: $REVERT_HEALTH. $(date)"
              exit 1
            fi

            echo "Deploy successful. Production cut over automatically, health check passed."
            ntfy publish --title "Deploy Succeeded" --priority default pratik-gateway-alerts "industrial-backend deployed successfully, health check passed. $(date)"
