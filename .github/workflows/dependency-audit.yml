name: Dependency Audit

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Notify on findings
        if: steps.audit.outcome == 'failure'
        run: |
          curl -H "Title: npm audit found vulnerabilities" -H "Priority: high" \
            -d "industrial-backend: npm audit found high+ severity issues. Check the Actions tab for details." \
            https://ntfy.sh/pratik-gateway-alerts

      - name: Notify clean
        if: steps.audit.outcome == 'success'
        run: |
          curl -H "Title: npm audit clean" -H "Priority: low" \
            -d "industrial-backend: weekly dependency audit found nothing at high severity or above." \
            https://ntfy.sh/pratik-gateway-alerts
