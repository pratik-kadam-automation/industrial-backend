name: Verify

on: [push]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax of all JS files
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f"
          done

      - name: Check for hardcoded secrets
        run: |
          if grep -rEn "(-----BEGIN|AKIA)" --include="*.js" . | grep -v node_modules; then
            echo "Found what looks like a hardcoded secret. Failing build."
            exit 1
          fi
