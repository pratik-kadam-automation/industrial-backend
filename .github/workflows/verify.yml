name: Verify

on: [push]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: pratik
          POSTGRES_PASSWORD: ci_only_throwaway_password
          POSTGRES_DB: factory_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax of all JS files
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f"
          done

      - name: Check for hardcoded secrets
        run: |
          if grep -rEn "(-----BEGIN|AKIA)" --include="*.js" . | grep -v node_modules; then
            echo "Found what looks like a hardcoded secret. Failing build."
            exit 1
          fi

      - name: Run automated tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: pratik
          DB_PASSWORD: ci_only_throwaway_password
          DB_NAME: factory_data_test
